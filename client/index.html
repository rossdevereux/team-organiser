            "Automated equal game time squad rotation",

            "Instant WhatsApp squad card export",
            "Printable matchday team sheets",
            "Player absence and holiday tracking",
            "Offline-capable Progressive Web Application (PWA)"
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What are the FA youth football playing time rules for equal minutes?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The English FA and grassroots governing bodies recommend that all players in mini-soccer and youth football (U7 to U14) receive equal playing time, with a minimum of 50% game time per match across the season to ensure player development."
              }
            },
            {
              "@type": "Question",
              "name": "How does SubShuffle calculate fair substitution rotations?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "SubShuffle balances minutes played across match halves or quarters based on squad attendance, match duration, and pitch format (5v5, 7v7, 9v9, 11v11), alerting coaches if any player falls below fair play thresholds."
              }
            },
            {
              "@type": "Question",
              "name": "Can I use SubShuffle offline at the pitch side?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. SubShuffle is an offline-capable Progressive Web App (PWA). You can save lineups, record substitutions, and track match minutes without an active mobile data connection."
              }
            },
            {
              "@type": "Question",
              "name": "Is SubShuffle free for youth football coaches?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, SubShuffle is 100% free for grassroots coaches and team managers, offering an instant sandbox demo mode and cloud synchronization."
              }
            }
          ]
        }
      ]
    }
