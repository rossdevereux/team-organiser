name: Deploy Pipeline (Live & Beta)

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

env:
  GCP_PROJECT_ID: team-organiser-prod
  GCP_REGION: europe-west1
  ARTIFACT_REGISTRY_REPO: team-organiser

jobs:
  # Determine environment targets based on branch
  set-env:
    name: Resolve Environment Target
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.step1.outputs.env_name }}
      cloud_run_service: ${{ steps.step1.outputs.cloud_run_service }}
      hosting_target: ${{ steps.step1.outputs.hosting_target }}
      max_instances: ${{ steps.step1.outputs.max_instances }}
    steps:
      - id: step1
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "env_name=production" >> "$GITHUB_OUTPUT"
            echo "cloud_run_service=team-organiser-api" >> "$GITHUB_OUTPUT"
            echo "hosting_target=live" >> "$GITHUB_OUTPUT"
            echo "max_instances=10" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=beta" >> "$GITHUB_OUTPUT"
            echo "cloud_run_service=backend-api-beta" >> "$GITHUB_OUTPUT"
            echo "hosting_target=beta" >> "$GITHUB_OUTPUT"
            echo "max_instances=2" >> "$GITHUB_OUTPUT"
          fi

  # Deploy Backend to Cloud Run
  deploy-backend:
    name: Build & Deploy Backend (${{ needs.set-env.outputs.env_name }})
    needs: set-env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker Auth for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Server Docker Image
        run: |
          SERVICE_NAME="${{ needs.set-env.outputs.cloud_run_service }}"
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${SERVICE_NAME}:${{ github.sha }}"
          ENV_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${SERVICE_NAME}:latest"

          docker build -t "$IMAGE_TAG" -t "$ENV_TAG" ./server
          docker push "$IMAGE_TAG"
          docker push "$ENV_TAG"

      - name: Deploy to Cloud Run (Zero-Idle Cost)
        run: |
          SERVICE_NAME="${{ needs.set-env.outputs.cloud_run_service }}"
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${SERVICE_NAME}:${{ github.sha }}"

          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE_TAG" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances ${{ needs.set-env.outputs.max_instances }} \
            --memory 512Mi \
            --cpu 1 \
            --update-env-vars NODE_ENV=production \
            --update-secrets STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest

  # Deploy Frontend to Firebase Hosting
  deploy-frontend:
    name: Build & Deploy Frontend (${{ needs.set-env.outputs.hosting_target }})
    runs-on: ubuntu-latest
    needs: [set-env, deploy-backend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci
        working-directory: ./client

      - name: Build Client SPA
        run: npm run build
        working-directory: ./client
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting Target
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ env.GCP_PROJECT_ID }}
          target: ${{ needs.set-env.outputs.hosting_target }}
          channelId: live
